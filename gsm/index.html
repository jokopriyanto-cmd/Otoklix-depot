*{box-sizing:border-box}html{margin:0;background:#0a2760}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(120% 90% at 80% 0%,#1d5fd1 0%,#0f3f9e 38%,#0a2760 75%,#081c48 100%) no-repeat;background-color:#0a2760;padding-bottom:40px}
.shell{display:flex;min-height:100vh}
.sb{display:flex;flex-direction:column;width:220px;flex:none;background:rgba(4,16,48,.55);border-right:1px solid rgba(255,255,255,.12);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb .bt{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-family:'Outfit',system-ui;margin:0 4px 18px;font-size:16px}
.sb .bt i{width:44px;height:32px;background:#fff var(--logo) center/contain no-repeat;background-origin:content-box;padding:3px;border-radius:9px;flex:none}
.sb .ni{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;padding:11px 12px;margin-bottom:4px;background:transparent;color:rgba(255,255,255,.85);cursor:pointer;text-align:left}
.sb .ni svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb .ni.lo{margin-top:auto;color:#ffb4ab}.sb .ni:hover{background:rgba(255,255,255,.1)}.sb .ni.on{background:#fff;color:var(--navy)}
.main{flex:1;min-width:0}
.hb2{display:none;font:inherit;font-size:22px;line-height:1;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;padding:8px 12px;cursor:pointer}
body.nologin .sb,body.nologin .hb2{display:none}
.scrim{display:none}
@media(max-width:800px){.sb{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .2s;background:#071a47;width:240px}body.sbo .sb{transform:none}body.sbo .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}.hb2{display:block}}
.wrap{max-width:none;margin:0;padding:18px 24px}
.kb{cursor:pointer;text-align:left;font:inherit;border:0;border-top:4px solid var(--navy)}.kb:hover{transform:translateY(-2px)}.k.kb.w{border-top-color:var(--accent)}.k.kb.g{border-top-color:var(--ok)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f3f6fc}
.rc{cursor:pointer}.rc:hover{box-shadow:0 6px 18px rgba(4,20,70,.35)}
.sigcv{width:100%;max-width:520px;aspect-ratio:600/220;border:1px dashed #64748b;border-radius:10px;background:#fff;touch-action:none;display:block}
.ov{position:fixed;inset:0;background:rgba(2,10,40,.6);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.ov .pn{background:#fff;border-radius:16px;border-top:5px solid var(--accent);padding:18px;max-width:760px;width:100%}
.pn h2{margin:0;color:var(--navy)}.pn h4{margin:16px 0 6px;color:var(--accent);text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}.kv small{display:block;color:var(--mut);font-size:12px}.kv div{font-size:14px;word-break:break-word}
@media(max-width:600px){.kv{grid-template-columns:1fr 1fr}}
.xl{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:#1b9a62;color:#fff;cursor:pointer;white-space:nowrap}
iframe.ff{width:100%;height:1250px;border:0;border-radius:12px;background:#fff}
.hd{display:flex;align-items:center;gap:14px;color:#fff;margin:6px 0 14px}
.hd .lg{width:84px;height:60px;flex:none;background:#fff var(--logo) center/contain no-repeat;background-origin:content-box;padding:6px;border-radius:14px}
.hd h1{font-family:'Outfit',system-ui,sans-serif;font-size:24px;margin:0}.hd h1 em{font-style:normal;color:#ffb27a}
.hd p{margin:2px 0 0;opacity:.8;font-size:13px}.hd .gr{flex:1}
.who{font-size:12px;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:5px 12px;white-space:nowrap}
.out{font:inherit;font-size:12px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:5px 12px;cursor:pointer;margin-left:6px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tb{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:99px;padding:9px 18px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}.tb.on{background:#fff;color:var(--navy)}
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pl{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:99px;padding:6px 14px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}.pl.on{background:var(--accent)}
.nav{font:inherit;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;padding:5px 11px;cursor:pointer;font-size:16px}
.plab{color:#fff;font-weight:700;font-size:14px;padding:0 6px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kp4{grid-template-columns:repeat(4,1fr)}.kp1{grid-template-columns:1fr}
.k{background:#fff;border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(4,20,70,.25);border-top:4px solid var(--navy)}.k b{display:block;font-size:26px;font-family:'Outfit',system-ui;color:var(--navy)}.k span{font-size:12px;color:var(--mut)}
.k.w{border-top-color:var(--accent)}.k.w b{color:#b45309}.k.g{border-top-color:var(--ok)}.k.g b{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;font-size:15px;padding:10px 12px;border:0;border-radius:10px;background:#fff;color:var(--ink);outline:none}
input{flex:1;min-width:160px}
.card,.panel{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(4,20,70,.25)}
.panel h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .panel{margin-bottom:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;flex-wrap:wrap}
.top b{font-size:15px}.sub{font-size:13px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2fb;color:var(--navy)}
.pill.ok{background:#e1f5ea;color:#0e7a4a}.pill.warn{background:#fff0e0;color:#b45309}.pill.bad{background:#fde8e6;color:#b3261e}
.prog{height:7px;border-radius:99px;background:#e6ecf8;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:#1b9a62}
.small{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #eef2fa;vertical-align:top}.n{text-align:right;font-weight:700}
td small{display:block;color:var(--mut);font-size:11px}
tr.tot td{font-weight:800;border-top:2px solid var(--line)}
